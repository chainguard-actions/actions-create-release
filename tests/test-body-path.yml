name: Test release creation with body_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create release notes file
        run: |
          echo "## Changelog" > /tmp/release-notes.md
          echo "- Feature A added" >> /tmp/release-notes.md
          echo "- Bug B fixed" >> /tmp/release-notes.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.1.0
          release_name: "Release v1.1.0"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
      - name: Assert release with body_path ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          UPLOAD_URL: ${{ steps.action.outputs.upload_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "html_url: $HTML_URL"
          echo "upload_url: $UPLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but 'id' output is empty"
              exit 1
            fi
            if [ -z "$HTML_URL" ]; then
              echo "FAIL: action succeeded but 'html_url' output is empty"
              exit 1
            fi
            if [ -z "$UPLOAD_URL" ]; then
              echo "FAIL: action succeeded but 'upload_url' output is empty"
              exit 1
            fi
            echo "PASS: release created with body_path, id=$ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
